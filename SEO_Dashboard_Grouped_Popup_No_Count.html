<style>

.wrap{overflow-x:auto}.grid{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));gap:4px;min-width:660px}

.cell.td{border:2px solid var(--pr)}.cell b{font-size:13px;color:var(--mu)}.cell.h{background:color-mix(in srgb,var(--od) 10%,var(--card))}.cell.we{background:color-mix(in srgb,var(--mu) 8%,var(--card))}.hn{display:block;font-size:11px;color:var(--od);line-height:1.25;margin-top:2px}.note{font-size:12px;color:var(--mu);margin-top:8px}

.f label.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx)}.ck input{width:auto}
.f label.rd{display:inline-block;font-size:inherit;color:inherit}.f summary{cursor:pointer;color:var(--pr);font-size:13.5px;margin-top:4px}.tl{flex-wrap:wrap}.wn{flex-basis:100%;font-style:normal;font-size:12px;color:var(--od)}.warn{background:color-mix(in srgb,var(--od) 10%,var(--card));border:1px solid var(--od);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13.5px}[hidden]{display:none!important}.tlg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}.tlg .row{align-items:center}.tlg input[type=number]{padding:3px 6px}.tlg select{padding:3px 6px}.srow{display:flex;gap:6px;margin-top:10px}.srow input{flex:1;min-width:0}.srow input[type=date]{flex:none}.card .row button{padding:2px 8px;font-size:12px}.card .row{cursor:default}.card .row:hover{color:inherit}.tl .dt{display:flex;gap:4px;align-items:center}.tl input{width:auto;padding:3px 6px;font-size:12.5px}.tl button{font-size:12px;padding:2px 8px}.pv{background:var(--bg);border-radius:10px;padding:8px 12px;margin-top:10px}.pv label{font-size:12px;color:var(--mu)}.tl{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}.tl i{width:10px;height:10px;border-radius:50%;flex:none}.tl span{margin-left:auto;color:var(--mu);white-space:nowrap;font-size:12px}
.chip{display:block;color:#fff;font-size:11.5px;border-radius:5px;padding:1px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell small{color:var(--mu);font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}.card h3{margin:0 0 8px;font-size:16px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.st{font-size:12px;color:#fff;border-radius:999px;padding:1px 9px}
.prog{height:7px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0 10px}.prog div{height:100%;background:var(--dn)}
.row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--bd);cursor:pointer;font-size:13.5px}.row:hover{color:var(--pr)}.row .d{color:var(--mu);white-space:nowrap;font-size:12px}.od{color:var(--od)!important}

.md{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:520px;margin:auto}.md h3{margin:0 0 10px}

.empty{color:var(--mu);font-size:13px;padding:6px 0}
.pb select{margin-left:0}.pg{margin-bottom:14px;padding:12px 14px}.pg h3 small{color:var(--mu);font-weight:400;font-size:12.5px;margin-left:6px}

}

/* Calendar: compact per-stage statuses and consistent editor controls */

// Classify article titles that explicitly contain a subject as academic articles.
// Follow subjects configured in Settings, with common Thai title abbreviations.
function subjectFromTitle(title){
 const v=String(title||'').trim();if(!v)return '';
 const aliases={
  'คณิตศาสตร์':['คณิตศาสตร์','คณิต'],
  'ฟิสิกส์':['ฟิสิกส์'],
  'ไทย':['ภาษาไทย', 'วิชาไทย', 'ข้อสอบไทย', 'A-Level ไทย', 'TGAT ไทย'],
  'สังคม':['สังคมศึกษา','วิชาสังคม','ข้อสอบสังคม','สังคม'],
  'อังกฤษ':['ภาษาอังกฤษ','วิชาอังกฤษ','ข้อสอบอังกฤษ','อังกฤษ','English'],
  'ชีววิทยา':['ชีววิทยา','ชีวะ']
 };
 for(const subject of curSubj()){
  const patterns=aliases[subject.n]||[subject.n];
  if(patterns.some(x=>v.toLocaleLowerCase().includes(x.toLocaleLowerCase())))return subject.n;
 }
 return '';
}
function classifyAcademic(t){
 if(!t||t.type!=='บทความ')return t;
 const subj=subjectFromTitle(t.title);
 if(!subj)return t;
 // Let the normal configuration-driven timeline migration handle the new type.
 return {...t,type:'บทความวิชาการ',subj,timelineSchema:undefined};
}

function adaptCalendarTask(t){
 t=classifyAcademic(t);
 if(!t||t.timelineSchema===2)return t;
 const original=Array.isArray(t.steps)?t.steps:[];
 const generated=build({type:t.type,date:t.date,subj:t.subj||SUBJ[0],o:t.opts||{intent:true,iv:true}});
 const used=new Set();const issues=[];
 const mapped=generated.map(x=>{
  const kind=expectedKind(x);
  const choices=original.map((v,i)=>({v,i})).filter(z=>!used.has(z.i)&&stageKind(z.v)===kind);
  const choice=choices[0];
  if(choice){used.add(choice.i);const raw=choice.v.sourceStatus||choice.v.status||'';
   const uncertain=!raw||raw==='ไม่ระบุ'||raw==='plan';
   return {...x,status:migrateStageStatus(choice.v.status),issue:uncertain?'สถานะเดิมไม่ชัดเจน กรุณาตรวจสอบ':''};
  }
  return {...x,status:'writing',issue:'ไม่มีสถานะตรงกับขั้นตอนนี้ในข้อมูลเดิม กรุณาตรวจสอบ'};
 });
 const unmatched=original.filter((_,i)=>!used.has(i));
 if(unmatched.length)issues.push('มี '+unmatched.length+' ขั้นตอนเดิมที่ไม่ตรงกับขั้นตอนในตั้งค่า (ไม่นำมาใช้): '+unmatched.map(x=>x.n).join(', '));
 if(!t.assignee||!TEAM0.includes(t.assignee))issues.push('ยังไม่มีผู้รับผิดชอบที่ถูกต้อง (เตย / ออม / ฝน)');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date||''))issues.push('วันที่เริ่มงานไม่ถูกต้อง');
 if(!TYPES.includes(t.type))issues.push('ประเภทงานไม่ตรงกับการตั้งค่า');
 const known=original.some(v=>v.status==='done')&&original.some(v=>v.status!=='done');
 const status=known?'writing':migrateStageStatus(t.status);
 return {...t,steps:mapped,status,timelineSchema:2,migrationIssues:issues,end:mapped.reduce((a,x)=>x.e>a?x.e:a,t.date)};
}

async function save(force){

 const f={title:g('f_t'),assignee:g('f_a'),date:F.date,type:F.type,status:g('f_s'),url:g('f_u'),note:g('f_n'),subj:F.subj,opts:F.o,steps:cs};
 if(!f.title||!f.assignee){alert('กรุณากรอกชื่องานและผู้รับผิดชอบ');return}if(editId){const old=tasks.find(x=>x.id===editId);if(old?.csvImported)f.csvImported=true;}f.timelineSchema=2;f.steps=f.steps.map(x=>{const {owner,sourceOwner,sourceStatus,...r}=x;return r});f.migrationIssues=[];
 f.end=cs.reduce((m,x)=>x.e>m?x.e:m,F.date);
 try{

function addTimelineRow(t){

 if(rows.some(([k,v])=>v===name))return alert('มีขั้นตอนชื่อนี้อยู่แล้ว');

function removeTimelineRow(t,i){
 const rows=draftTimelineRows(t);if(rows.length<=1)return alert('ต้องมีอย่างน้อย 1 ขั้นตอน');

 changeTimelineRows(t,rows.filter((_,j)=>i!==j));
}
function moveTimelineRow(t,i,d){
 const rows=draftTimelineRows(t).map(x=>[...x]),j=i+d;if(j<0||j>=rows.length)return;
 [rows[i],rows[j]]=[rows[j],rows[i]];changeTimelineRows(t,rows);

const normalizeOwners=p=>({...p,owners:[...new Set(owners(p).map(n=>OWNER_NAMES[n]).filter(Boolean))]});
const prjPeople=()=>PROJECT_TEAM;
const pOrd=(a,b)=>(a.ord??0)-(b.ord??0);
const prec=x=>({project:x.project||'',sub:x.sub||'',owners:owners(x),due:x.due||'',status:x.status||'Not Started',note:x.note||'',ord:x.ord??0,hid:x.hid?1:0,del:x.del?1:0,delAt:x.delAt||0});
function prjShell(){
 return `<div class="bar pb"><h2 style="margin:0 8px 0 0;text-align:left">โปรเจกต์ SEO</h2>
 <div class="filter-field status-filter"><select aria-label="กรองตามสถานะ" onchange="pS=this.value;drawPrj()"><option value="">ทุกสถานะ</option>${PST.map(([s])=>`<option ${s===pS?'selected':''}>${s}</option>`).join('')}</select></div>
 <div class="filter-field owner-filter"><select aria-label="กรองตามผู้รับผิดชอบ" onchange="pP=this.value;drawPrj()"><option value="">ทุกคน</option>${prjPeople().map(p=>`<option ${p===pP?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
 <input type="search" aria-label="ค้นหางานและโปรเจกต์ SEO" placeholder="ค้นหาชื่อโปรเจกต์หรืองานย่อย…" value="${esc(pQ)}" oninput="pQ=this.value;drawPrj()" style="flex:1;min-width:140px">
 <button id="pbH" onclick="pShowH=!pShowH;drawPrj()"></button><button id="pbT" onclick="openTrash()"></button>
 <button class="pr" onclick="openPrj()">+ เพิ่มงาน</button></div><div id="pt"></div>`}
const isHP=p=>pHP.includes(p||''),isHid=x=>!!x.hid||isHP(x.project),pvis=x=>pShowH||!isHid(x);
function drawPrj(){
 const el=G('pt');if(!el)return;
 const q=pQ.trim().toLowerCase(),sorted=[...prj].sort(pOrd),flt=!!(q||pS||pP);
 const nh=prj.filter(isHid).length,hb=G('pbH');
 if(hb){hb.style.display=nh?'':'none';hb.className=pShowH?'on':'';hb.textContent=(pShowH?'ซ่อนรายการที่ซ่อนไว้':'แสดงที่ซ่อนไว้')+' ('+nh+')'}
 const tb=G('pbT'),tn=ptrGroups().length;if(tb)tb.textContent='🗑 ถังขยะ'+(tn?' ('+tn+')':'');
 const base=sorted.filter(pvis);
 const list=base.filter(x=>(!pS||x.status===pS)&&(!pP||owners(x).includes(pP))&&(!q||[x.project,x.sub,x.due,x.note,owners(x).join(' ')].join(' ').toLowerCase().includes(q)));
 const gs=[];list.forEach(x=>{const g=x.project||'';if(!gs.includes(g))gs.push(g)});pgKeys=gs;
 let h=`<div class="sum"><div><b>${base.length}</b><span>รายการทั้งหมด</span></div>`+PST.map(([s,c])=>`<div><b style="color:${c}">${base.filter(x=>x.status===s).length}</b><span>${s}</span></div>`).join('')+'</div>';
 if(!prj.length)h+='<p class="empty">ยังไม่มีข้อมูล กด “+ เพิ่มงาน” เพื่อเริ่มเพิ่ม</p>';
 else if(!list.length)h+='<p class="empty">ไม่พบรายการที่ตรงกับตัวกรอง</p>';
 gs.forEach((g,gi)=>{
  const items=list.filter(x=>(x.project||'')===g),all=base.filter(x=>(x.project||'')===g),dn=all.filter(x=>x.status==='Done').length,op=flt||pOpen.has(g),hp=isHP(g);
  h+=`<div class="card pg${hp?' hd':''}"><div class="ph" onclick="togPG(${gi})"><span class="chv${op?' o':''}">▸</span><b>${esc(g||'(ไม่ระบุโปรเจกต์)')}</b><small>เสร็จ ${dn}/${all.length}</small><span class="pbar"><i style="width:${all.length?Math.round(dn/all.length*100):0}%"></i></span><button class="hb" onclick="event.stopPropagation();hidePG(${gi})">${hp?'เลิกซ่อน':'ซ่อน'}</button><button class="hb od" onclick="event.stopPropagation();delPG(${gi})">ลบ</button></div>`;
  if(op)h+=`<div class="pbody"><div class="wrap"><table class="pt"><thead><tr><th>งานย่อย</th><th>ผู้รับผิดชอบ</th><th>วันสิ้นสุด</th><th>Status</th><th>Note</th><th></th></tr></thead><tbody>`
   +items.map(x=>`<tr class="${isHid(x)?'hd':''}" onclick="openPrj('${x.id}')"><td>${esc(x.sub||'—')}</td><td>${esc(owners(x).join(', '))}</td><td>${esc(x.due)}</td><td><select onclick="event.stopPropagation()" onchange="setPS('${x.id}',this.value)" style="color:${pcolor(x.status)};border-color:${pcolor(x.status)}">${PST.map(([s])=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td class="nt">${esc(x.note)}</td><td><button class="hb" onclick="event.stopPropagation();hideRow('${x.id}')">${x.hid?'เลิกซ่อน':'ซ่อน'}</button></td></tr>`).join('')
   +`</tbody></table></div><div class="pf"><button onclick="openPrj(null,pgKeys[${gi}])">+ เพิ่มงานย่อย</button></div></div>`;
  h+='</div>'});
 el.innerHTML=h}
function togPG(i){const k=pgKeys[i];if(k==null)return;pOpen.has(k)?pOpen.delete(k):pOpen.add(k);drawPrj()}
async function pmetaWrite(l){pHP=l;saveLocal();drawPrj();if(pmeta){try{await pmeta.set({hp:l})}catch(e){alert('บันทึกไม่สำเร็จ: '+(e.message||e.code||''))}}}
async function delPG(i){
 const k=pgKeys[i];if(k==null)return;
 const rows=prj.filter(x=>(x.project||'')===k),now=Date.now();
 if(!confirm('ย้ายโปรเจกต์ “'+(k||'ไม่ระบุโปรเจกต์')+'” พร้อมงานย่อย '+rows.length+' รายการ ไปที่ถังขยะ?\nกู้คืนได้จากปุ่มถังขยะ'))return;
 try{
  if(pcol){for(const x of rows)await pcol.doc(x.id).set({...prec(x),del:1,delAt:now})}
  else{prj=prj.filter(x=>(x.project||'')!==k);ptr.push(...rows.map(x=>({...x,del:1,delAt:now})));saveLocal()}
 }catch(e){alert('ลบไม่สำเร็จ: '+(e.message||e.code||''));return}
 pOpen.delete(k);drawPrj()}
function ptrGroups(){const m=new Map();ptr.forEach(x=>{const k=x.project||'';if(!m.has(k))m.set(k,[]);m.get(k).push(x)});
 return[...m.entries()].map(([k,r])=>({k,r,at:Math.max(...r.map(x=>x.delAt||0))})).sort((a,b)=>b.at-a.at)}
function openTrash(){editId=null;mview='trash';trashView()}
function trashView(){
 const gs=ptrGroups();ptKeys=gs.map(g=>g.k);
 G('md').style.maxWidth='620px';
 G('md').innerHTML=`<h3>🗑 ถังขยะ</h3>${gs.length?gs.map((g,i)=>`<div class="row" style="cursor:default;align-items:center"><span style="flex:1"><b>${esc(g.k||'(ไม่ระบุโปรเจกต์)')}</b><br><small style="color:var(--mu)">${g.r.length} งานย่อย${g.at?' · ลบเมื่อ '+fmt(ymd(new Date(g.at))):''}</small></span><button onclick="restorePG(${i})">กู้คืน</button><button class="od" onclick="purgePG(${i})">ลบถาวร</button></div>`).join(''):'<div class="empty">ถังขยะว่างเปล่า</div>'}
 <div style="display:flex;gap:8px;margin-top:14px">${gs.length?'<button class="od" onclick="purgeAll()">ล้างถังขยะ</button>':''}<button style="margin-left:auto" onclick="closeM()">ปิด</button></div>`;
 G('ov').classList.add('s')}
async function restorePG(i){
 const k=ptKeys[i];if(k==null)return;const rows=ptr.filter(x=>(x.project||'')===k);
 try{
  if(pcol){for(const x of rows)await pcol.doc(x.id).set({...prec(x),del:0,delAt:0})}
  else{ptr=ptr.filter(x=>(x.project||'')!==k);prj.push(...rows.map(x=>({...x,del:0,delAt:0})));saveLocal()}
 }catch(e){alert('กู้คืนไม่สำเร็จ: '+(e.message||e.code||''));return}
 pOpen.add(k);drawPrj();trashView()}
async function purgeRows(rows){
 try{if(pcol){for(const x of rows)await pcol.doc(x.id).delete()}else{const ids=new Set(rows.map(x=>x.id));ptr=ptr.filter(x=>!ids.has(x.id));saveLocal()}}
 catch(e){alert('ลบไม่สำเร็จ: '+(e.message||e.code||''));return false}
 return true}
async function cleanHP(k){if(pHP.includes(k)&&!prj.some(x=>(x.project||'')===k))await pmetaWrite(pHP.filter(x=>x!==k))}
async function purgePG(i){
 const k=ptKeys[i];if(k==null)return;const rows=ptr.filter(x=>(x.project||'')===k);
 if(!confirm('ลบถาวร “'+(k||'ไม่ระบุโปรเจกต์')+'” พร้อมงานย่อย '+rows.length+' รายการ?\nลบแล้วกู้คืนไม่ได้'))return;
 if(await purgeRows(rows)){await cleanHP(k);drawPrj();trashView()}}
async function purgeAll(){
 const gs=ptrGroups();if(!gs.length||!confirm('ล้างถังขยะทั้งหมด '+gs.length+' โปรเจกต์?\nลบแล้วกู้คืนไม่ได้'))return;
 if(await purgeRows([...ptr])){for(const g of gs)await cleanHP(g.k);drawPrj();trashView()}}
function hidePG(i){const k=pgKeys[i];if(k==null)return;pmetaWrite(pHP.includes(k)?pHP.filter(x=>x!==k):[...pHP,k])}
async function hideRow(id){const x=prj.find(p=>p.id===id);if(x)await prjWrite(id,{...prec(x),hid:x.hid?0:1})}
async function prjWrite(id,f){
 try{
  if(pcol){if(id)await pcol.doc(id).set(f);else await pcol.add(f)}
  else{if(id)prj=prj.map(x=>x.id===id?{id,...f}:x);else prj.push({id:'l'+Date.now()+Math.random().toString(36).slice(2,6),...f});saveLocal();drawPrj()}
 }catch(e){alert('บันทึกไม่สำเร็จ: '+(e.message||e.code||''));return false}
 return true}
async function setPS(id,v){const x=prj.find(p=>p.id===id);if(x)await prjWrite(id,{...prec(x),status:v})}
function newOrd(project){return ordsFor(project,1)[0]}
function ordsFor(project,n){const s=[...prj].sort(pOrd),i=s.map(x=>x.project||'').lastIndexOf(project);
 if(i<0){const b=s.length?(s[s.length-1].ord??0):0;return Array.from({length:n},(_,k)=>b+1+k)}
 const a=s[i].ord??0,b=s[i+1]?.ord;return Array.from({length:n},(_,k)=>b==null?a+1+k:a+(b-a)*(k+1)/(n+1))}
function openPrj(id,pre){editId=null;pEdit=id||null;pPre=pre||'';mview='prj';modal()}
function pBlock(x,ppl,canRm){const ow=owners(normalizeOwners(x));
 return `<div class="pjb"><div class="pjh"><b>งานย่อย</b>${canRm?`<button type="button" onclick="this.closest('.pjb').remove()">✕ เอาช่องนี้ออก</button>`:''}</div><div class="f">
 <div class="w"><label>ชื่องานย่อย</label><input class="b_s" value="${esc(x.sub)}"></div>
 <div class="w"><label>ผู้รับผิดชอบ</label>${ppl.map(p=>`<label class="rd"><input type="checkbox" value="${esc(p)}" ${ow.includes(p)?'checked':''}><span>${esc(p)}</span></label>`).join('')}</div>
 <div><label>วันสิ้นสุด</label><input class="b_d" value="${esc(x.due)}" placeholder="เช่น Aug, Nov - Dec"></div>
 <div><label>Status</label><select class="b_t">${PST.map(([s])=>`<option ${s===(x.status||'Not Started')?'selected':''}>${s}</option>`).join('')}</select></div>
 <div class="w"><label>Note</label><textarea class="b_n" rows="2">${esc(x.note)}</textarea></div></div></div>`}
function addBlk(){const c=G('pj_b');c.insertAdjacentHTML('beforeend',pBlock({},prjPeople(),true));c.lastElementChild.scrollIntoView({block:'nearest'})}
function prjForm(){
 const x=prj.find(p=>p.id===pEdit),projs=[...new Set(prj.map(p=>p.project||'').filter(Boolean))];
 G('md').style.maxWidth='680px';
 G('md').innerHTML=`<h3>${pEdit?'✏️ แก้ไขงาน':'➕ เพิ่มงาน'}</h3><div class="f"><div class="w"><label>Project</label><input id="pj_p" list="pj_l" value="${esc(x?x.project||'':pPre)}"><datalist id="pj_l">${projs.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div></div>
 <div id="pj_b">${pBlock(x||{},prjPeople(),false)}</div>${pEdit?'':'<button type="button" style="margin-top:10px" onclick="addBlk()">+ เพิ่มงานย่อยอีก</button>'}
 <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="pr" onclick="savePrj()">บันทึก</button><button onclick="closeM()">ยกเลิก</button>${pEdit?'<button class="od" style="margin-left:auto" onclick="delPrj()">ลบ</button>':''}</div>`;
 G('ov').classList.add('s')}
async function savePrj(){
 const project=G('pj_p').value.trim();
 const bs=[...document.querySelectorAll('#pj_b .pjb')].map(b=>{const ow=[...b.querySelectorAll('input[type=checkbox]:checked')].map(e=>e.value);

  return{sub:b.querySelector('.b_s').value.trim(),owners:ow,due:b.querySelector('.b_d').value.trim(),status:b.querySelector('.b_t').value,note:b.querySelector('.b_n').value.trim()}});
 if(pEdit){const b=bs[0];if(!project&&!b.sub){alert('กรุณากรอก Project หรืองานย่อย');return}
  const old=prj.find(p=>p.id===pEdit),ord=old&&(old.project||'')===project?(old.ord??0):newOrd(project);
  if(await prjWrite(pEdit,{project,...b,ord,hid:old&&old.hid?1:0}))closeM();return}
 const used=bs.filter(b=>b.sub||b.owners.length||b.due||b.note);
 if(!project&&!used.length){alert('กรุณากรอก Project หรืองานย่อย');return}
 const rows=used.length?used:[bs[0]],ords=ordsFor(project,rows.length);
 for(let i=0;i<rows.length;i++){if(!await prjWrite(null,{project,...rows[i],ord:ords[i],hid:0}))return}
 pOpen.add(project);closeM()}
async function delPrj(){
 if(!pEdit||!confirm('ลบรายการนี้?'))return;
 try{if(pcol)await pcol.doc(pEdit).delete();else{prj=prj.filter(x=>x.id!==pEdit);saveLocal();drawPrj()}}catch(e){alert('ลบไม่สำเร็จ');return}
 closeM()}

// Initialize the dashboard with embedded CSV records before rendering.
// This also works when the file is opened locally without an online database.
const previous=loadLocal();
if(previous.calendarSeedVersion==='2026-new-calendar-v1'&&Array.isArray(previous.tasks))tasks=previous.tasks;else tasks=CSV_CALENDAR_SEED.map(x=>({...x}));
if(Array.isArray(previous.prj)){
 prj=previous.prj.map(normalizeOwners);
 ptr=(Array.isArray(previous.ptr)?previous.ptr:[]).map(normalizeOwners);
}else{
 prj=CSV_PROJECT_SEED.map(normalizeOwners);
}
if(previous.CFG&&typeof previous.CFG==='object')CFG=previous.CFG;
if(Array.isArray(previous.pHP))pHP=previous.pHP;
applyCfg();
tasks=tasks.map(adaptCalendarTask);
pOpen.add('PDF ประกอบบทความ');
saveLocal();
render();
(async()=>{
 for(let i=0;i<30&&!window.claude;i++)await new Promise(r=>setTimeout(r,100));
 let db=null;try{db=await window.claude?.use('db')}catch(e){}
 if(!db){setConn(false,'โหมดในเครื่อง · บันทึกอัตโนมัติในเบราว์เซอร์');return}
 col=db.collection('tasks');pcol=db.collection('projects');let seededCloud=false;
 try{
   const marker=db.collection('settings').doc('calendar-csv2026-new-v1');
   const marked=await marker.get();
   if(!marked.exists){
     const old=await col.get();
     for(const d of old.docs)await col.doc(d.id).delete();
     for(const t of CSV_CALENDAR_SEED){const {id,...data}=t;await col.doc(id).set(data)}
     await marker.set({imported:true,count:CSV_CALENDAR_SEED.length,at:Date.now()});
   }
 }catch(e){console.warn('Calendar migration failed',e);setConn(false,'นำเข้าปฏิทินออนไลน์ไม่สำเร็จ · ใช้ข้อมูลในเครื่อง')}

 pcol.onSnapshot(s=>{
  const a=s.docs.map(d=>({id:d.id,...d.data()}));
  prj=a.filter(x=>!x.del).map(normalizeOwners);ptr=a.filter(x=>x.del).map(normalizeOwners);
  // One-time import. Keep a server-side marker so deleted rows never reappear on reload.
  if(!seededCloud){seededCloud=true;
   (async()=>{
    try{
     const mark=db.collection('settings').doc('csv2026-import-v1');
     const exists=await mark.get();
     if(exists.exists)return;
     const keys=new Set(a.map(x=>[x.project||'',x.sub||'',(x.owners||[]).join(','),x.due||''].join('|').toLowerCase()));
     const missing=CSV_PROJECT_SEED.filter(x=>!keys.has([x.project,x.sub,x.owners.join(','),x.due].join('|').toLowerCase())&&!a.some(y=>y.id===x.id));
     for(const x of missing)await pcol.doc(x.id).set(x);
     await mark.set({imported:true,count:CSV_PROJECT_SEED.length,at:Date.now()});
    }catch(e){console.warn('CSV import failed',e);setConn(false,'นำเข้าข้อมูลบางส่วนไม่สำเร็จ')}
   })();
  }
  saveLocal();if(view==='prj'){render();if(mview==='trash'&&G('ov').classList.contains('s'))trashView()}
 },()=>{setConn(false,'เชื่อมต่อโปรเจกต์ไม่สำเร็จ · ใช้ข้อมูลในเครื่อง')});pmeta=db.collection('settings').doc('prj');pmeta.onSnapshot(s=>{pHP=s.exists?[...(s.data().hp||[])]:[];if(view==='prj')render()},()=>{});cfgDoc=db.collection('settings').doc('main');cfgDoc.onSnapshot(s=>{CFG=s.exists?s.data():{};applyCfg();if(!settingsDirty)settingsDraft=null;render()},()=>{});
 const tm=setTimeout(()=>setConn(false,'เชื่อมต่อช้า…'),10000);
 col.onSnapshot(s=>{clearTimeout(tm);tasks=s.docs.map(d=>adaptCalendarTask({id:d.id,...d.data()}));setConn(true,'ออนไลน์ · อัปเดต realtime');saveLocal();render()},
  e=>{clearTimeout(tm);setConn(false,'เชื่อมต่อไม่สำเร็จ')});
})();
</script></body></html>
